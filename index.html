<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>☕ David's Coffee</title>
    
    <!-- 로딩 화면 스타일 (인라인으로 즉시 표시) -->
    <style>
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFF8F0 0%, #F5E6D3 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-logo {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }
        .loading-text {
            font-size: 24px;
            color: #4A3428;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .loading-subtitle {
            font-size: 14px;
            color: #8B6F47;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .spinner {
            margin-top: 20px;
            width: 40px;
            height: 40px;
            border: 4px solid #E8D5C4;
            border-top-color: #6F4E37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <!-- CSS를 비동기로 로드 -->
    <link rel="preload" href="css/style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="css/style.css"></noscript>
</head>
<body>
    <!-- 로딩 화면 -->
    <div id="loading-screen">
        <div class="loading-logo">☕</div>
        <div class="loading-text">David's Coffee</div>
        <div class="loading-subtitle">메뉴 로딩 중...</div>
        <div class="spinner"></div>
    </div>

    <!-- 메인 컨텐츠 -->
    <div class="container">
        <header class="header">
            <h1 class="logo">☕ David's Coffee</h1>
            <p class="subtitle">신선한 원두와 드립백을 만나보세요</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('beans')">
                ☕ 원두
            </button>
            <button class="tab-btn" onclick="switchTab('drip')">
                📦 드립백
            </button>
        </div>

        <section id="beans-section" class="products-section active">
            <div class="products-grid" id="beansProducts">
                <!-- 원두 제품들이 여기에 동적으로 렌더링됩니다 -->
            </div>
        </section>

        <section id="drip-section" class="products-section">
            <div class="products-grid" id="dripProducts">
                <!-- 드립백 제품들이 여기에 동적으로 렌더링됩니다 -->
            </div>
        </section>
    </div>

    <!-- 장바구니 버튼 -->
    <button class="cart-btn" onclick="toggleCart()">
        🛒 <span id="cartCount">0</span>
    </button>

    <!-- 오버레이 -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <!-- 장바구니 사이드바 -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>🛒 장바구니</h2>
            <button class="close-btn" onclick="toggleCart()">×</button>
        </div>

        <div class="cart-body" id="cartItems">
            <div class="empty-cart">
                <p>🛒</p>
                <p>장바구니가 비어있습니다</p>
            </div>
        </div>

        <!-- 배송 정보 입력 -->
        <div class="shipping-info">
            <h3 class="shipping-title">📦 배송 정보</h3>
            
            <div class="form-group">
                <input type="text" id="shippingName" placeholder="이름" class="form-input">
            </div>
            
            <div class="form-group">
                <input type="tel" id="shippingPhone" placeholder="연락처" class="form-input">
            </div>
            
            <div class="form-group">
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="shippingRegion" value="shanghai" checked onchange="updateShippingFee()">
                        <span>상하이 지역</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="shippingRegion" value="other" onchange="updateShippingFee()">
                        <span>기타 지역</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <textarea id="shippingAddress" placeholder="상세 주소" class="form-textarea" rows="2"></textarea>
            </div>
        </div>

        <div class="cart-summary">
            <div class="summary-row">
                <span>상품 금액</span>
                <span id="productAmount">¥0</span>
            </div>
            <div class="summary-row">
                <span>배송비</span>
                <span id="shippingFee">+6 RMB</span>
            </div>
            <div class="summary-total">
                <span>총 결제 금액</span>
                <span class="total-price" id="totalPrice">¥0</span>
            </div>
            <button class="checkout-btn" onclick="showPaymentModal()">
                📋 주문 내역 복사하기
            </button>
            <div class="payment-info">
                💬 복사 후 위챗으로 보내주세요
            </div>
        </div>
    </div>

    <!-- 주문 확인 모달 -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✅ 주문 내역</h2>
                <button class="modal-close" onclick="closeOrderModal()">×</button>
            </div>
            <div class="modal-body">
                <div id="orderDetailsBox" class="order-details-box"></div>
                <button class="copy-btn" onclick="copyOrderDetails()">
                    📋 클립보드에 복사
                </button>
                <div class="wechat-guide">
                    <p>💬 위챗으로 돌아가서</p>
                    <p>채팅창에 <strong>붙여넣기</strong> 해주세요</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-confirm-btn" onclick="confirmOrder()">
                    확인
                </button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>📧 <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="97f3f6e1fef3e4c8f4f8f1f1f2f2d7f8e2e3fbf8f8fcb9f4f8fa">[email&#160;protected]</a></p>
        <p>🎁 200위안 이상 무료배송</p>
        <p>💰 위챗 송금 결제</p>
    </footer>

    <!-- JavaScript를 defer로 비동기 로드 -->
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script src="js/data.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/main.js" defer></script>
    
    <!-- 로딩 화면 숨기기 -->
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 500);
        });
    </script>
</body>
</html>
