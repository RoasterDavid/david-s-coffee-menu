<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>☕ David's Coffee - 원두 & 드립백 주문</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">☕ David's Coffee</h1>
            <p class="subtitle">신선한 원두와 드립백을 만나보세요</p>
        </header>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('beans')">
                ☕ 원두
            </button>
            <button class="tab-btn" onclick="switchTab('drip')">
                📦 드립백
            </button>
        </div>

        <!-- Products Section - Beans -->
        <section id="beans-section" class="products-section active">
            <div class="products-grid" id="beansProducts">
                <!-- Products will be loaded here by JavaScript -->
            </div>
        </section>

        <!-- Products Section - Drip -->
        <section id="drip-section" class="products-section">
            <div class="products-grid" id="dripProducts">
                <!-- Products will be loaded here by JavaScript -->
            </div>
        </section>
    </div>

    <!-- Cart Button (Fixed) -->
    <button class="cart-btn" onclick="toggleCart()">
        🛒
        <span class="cart-count" id="cartCount">0</span>
    </button>

    <!-- Cart Sidebar Overlay -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <!-- Cart Header -->
        <div class="cart-header">
            <h2>🛒 장바구니</h2>
            <button class="close-btn" onclick="toggleCart()">×</button>
        </div>

        <!-- Cart Body (전체 스크롤 영역) -->
        <div class="cart-body">
            <!-- Cart Items -->
            <div id="cartItems">
                <div class="empty-cart">
                    <p>🛒</p>
                    <p>장바구니가 비어있습니다</p>
                </div>
            </div>

            <!-- Shipping Information Form -->
            <div class="shipping-info">
                <h3 class="shipping-title">📦 배송 정보</h3>
                
                <div class="form-group">
                    <input type="text" id="shippingName" placeholder="이름" class="form-input">
                </div>
                
                <div class="form-group">
                    <input type="tel" id="shippingPhone" placeholder="연락처" class="form-input">
                </div>
                
                <div class="form-group">
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="shippingRegion" value="shanghai" checked onchange="updateShippingFee()">
                            <span>상하이 지역</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="shippingRegion" value="other" onchange="updateShippingFee()">
                            <span>기타 지역</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <textarea id="shippingAddress" placeholder="상세 주소" class="form-textarea" rows="2"></textarea>
                </div>
            </div>
        </div>

        <!-- Cart Summary (고정 영역) -->
        <div class="cart-summary">
            <div class="summary-row">
                <span>상품 금액</span>
                <span id="productAmount">¥0</span>
            </div>
            <div class="summary-row">
                <span>배송비</span>
                <span id="shippingFee">+6 RMB</span>
            </div>
            <div class="summary-total">
                <span>총 결제 금액</span>
                <span class="total-price" id="totalPrice">¥0</span>
            </div>
            <button class="checkout-btn" onclick="showPaymentModal()">📋 주문 내역 복사하기</button>
            <div class="payment-info">
                💬 복사 후 위챗으로 보내주세요
            </div>
        </div>
    </div>

    <!-- Order Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✅ 주문 내역</h2>
                <button class="modal-close" onclick="closeOrderModal()">×</button>
            </div>
            <div class="modal-body">
                <div id="orderDetailsBox" class="order-details-box"></div>
                <button class="copy-btn" onclick="copyOrderDetails()">📋 클립보드에 복사</button>
                <div class="wechat-guide">
                    <p>💬 위챗으로 돌아가서</p>
                    <p>채팅창에 <strong>붙여넣기</strong> 해주세요</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-confirm-btn" onclick="confirmOrder()">확인</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>📧 david_han76@outlook.com</p>
        <p>🎁 200위안 이상 무료배송</p>
        <p>💰 위챗 송금 결제</p>
    </footer>

    <!-- JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
